server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:file:./data/trading-simulator;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

jwt.secret=local-development-secret-change-before-production

rapid.api.key=demo
twelvedata.api.host=twelve-data1.p.rapidapi.com
alphavantage.api.key=demo
news.api.key=demo

app.mail.enabled=false
app.registration.auto-verify=true

logging.level.root=INFO
